<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tony B</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="https://kit.fontawesome.com/781cab6ddc.js" crossorigin="anonymous"></script>
  </head>
  <body>
    <section id="about-me">
      <nav>
        <div class="personal__logo">Tony B</div>
        <ul class="nav__link--list">
          <li>
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Languages</a
            >
          </li>

          <li>
            <a
              href=""
              class="nav__link--anchor link__hover-effect link__hover-effect--black"
              >Project</a
            >
          </li>

          <li>
            <a href="" class="nav__link--anchor nav__link--anchor-primary"
              >Contact</a
            >
          </li>
        </ul>
      </nav>
      <div class="flex flex-1">
        <div class="about-me__info row"></div>
        <div class="about-me__info--container">
          <figure class="about-me__picture--mask">
            <img src="./assets/me.jpeg" class="about-me__picture" alt="Placeholder Pic">
          </figure>
          <h1 class="about-me__info--title">
            Hi! I'm <span class="text--blue">Tony B!</span>
          </h1>
          <p class="about-me__info--para">I'm a <strong class="text--blue">software engineer and voiceover artist</strong> with a passion for helping other voiceover artists out with their website based projects.
          </p>
          <i class="fa-brands fa-square-linkedin about-me__link">
          </i>
        </div>
        </div>
        <figure class="about-me__img--container">
          <img src="./assets/undraw_websites.svg" alt="A person sitting at a desk with a computer monitor displaying a website layout, surrounded by web design elements and tools, representing web development and digital creativity in a professional setting.">
        </figure>
      </div>
    </section>
  </body>
</html>
